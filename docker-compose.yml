version: '3.8'

# ==============================================================================
# ORQUESTACIÓN DE CONTENEDORES (DOCKER COMPOSE)
# ==============================================================================
# Configura Ollama, la base de datos ChromaDB y prepara el backend FastAPI.
# ==============================================================================

services:
  ollama-engine:
    image: ollama/ollama:latest
    container_name: ollama-engine
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_VULKAN=1
      - GGML_VULKAN=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  fastapi-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - OLLAMA_HOST=http://ollama-engine:11434
      - CHROMA_HOST=http://chromadb:8000
    depends_on:
      - ollama-engine
      - chromadb
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000"  # Mapeado a 8001 en el host para evitar conflicto con FastAPI en el puerto 8000
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  ollama_models:
  chroma_data:
